<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ロト番号生成 — 抽せんデータ配信</title>
<style>
  /* ── 配色はトークンで一元管理する ──
     ライトを :root に全て定義し、ダークは「トークンだけ」を上書きする。
     ダークのブロックは基本規則より後ろに置く（同じ詳細度では後の宣言が勝つため、
     前に置くと明るい背景に明るい文字が重なって読めなくなる）。 */
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --text: #1a1d23;
    --muted: #565e6b;
    --border: #e3e7ed;
    --surface: #f5f7fa;
    --link: #1f56b8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c;
      --text: #e8ebf1;
      --muted: #aab3c1;
      --border: #2f3742;
      --surface: #1e2229;
      --link: #8ab4ff;
    }
  }

  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    max-width: 720px; margin: 0 auto; padding: 40px 20px 80px; line-height: 1.9;
    color: var(--text); background: var(--bg);
    -webkit-text-size-adjust: 100%;
  }
  h1 { font-size: 24px; margin: 0 0 6px; color: var(--text); }
  h2 { font-size: 17px; margin: 34px 0 10px; padding-bottom: 6px;
       border-bottom: 1px solid var(--border); color: var(--text); }
  h3 { font-size: 15px; margin: 20px 0 4px; color: var(--text); }
  p, li { font-size: 15px; color: var(--text); }
  ul { padding-left: 22px; }
  .meta { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
  .note { color: var(--muted); font-size: 13px; }
  .box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
         padding: 16px 18px; margin: 14px 0; color: var(--text); }
  .box p, .box li { color: var(--text); }
  .table-wrap { overflow-x: auto; margin: 10px 0; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { border: 1px solid var(--border); padding: 8px 12px; text-align: left;
           color: var(--text); }
  th { background: var(--surface); width: 34%; font-weight: 600; }
  a { color: var(--link); }
  a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  </style>
</head>
<body>
  <h1>ロト番号生成 — 抽せんデータ配信</h1>
  <p class="note">iOS アプリ「ロト番号生成」が参照する抽せん履歴データの配信先です。</p>
  <ul>
    <li><a href="loto/loto6_history.json">loto6_history.json</a></li>
    <li><a href="loto/loto7_history.json">loto7_history.json</a></li>
    <li><a href="loto/miniloto_history.json">miniloto_history.json</a></li>
  </ul>
  <h2 style="font-size:17px;margin-top:28px">アプリについて</h2>
  <ul>
    <li><a href="privacy.html">プライバシーポリシー</a></li>
    <li><a href="support.html">サポート・よくあるご質問</a></li>
  </ul>
  <p class="note">当せん番号・当せん金は宝くじ公式発表をご確認ください。本データは参考値です。</p>
</body>
</html>
