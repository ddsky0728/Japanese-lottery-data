name: 抽せんデータ自動更新

# 抽せんは 18:45（JST）、結果の掲載は 19:45 頃。
# 余裕をみて JST 21:00 と 22:00 の 2 回試す（1 回目が未公開でも 2 回目で拾える）。
# cron は UTC 指定のため JST から 9 時間引いた値を書く。
on:
  schedule:
    - cron: "0 12 * * 1,2,4,5"
    - cron: "0 13 * * 1,2,4,5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-draws
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抽せん結果を取得して取り込む
        run: python3 scripts/auto_update.py

      - name: 配信データを検証
        run: python3 scripts/verify.py

      - name: 変更があれば公開
        run: |
          if git diff --quiet -- loto/; then
            echo "更新なし"
            exit 0
          fi
          SUMMARY="$(python3 scripts/verify.py --summary)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add loto/
          git commit -m "抽せんデータ自動更新（${SUMMARY}）"
          git push
          echo "公開しました: ${SUMMARY}"
